# Tally Ops Interface — Netlify configuration
# Sitio estático, sin build. Mismo patrón que tally-dashboards.

[build]
  publish = "."
  # Ahorro de builds: solo construir cuando cambian archivos que el navegador realmente sirve.
  # Cambios de backend (scripts/apps-script.gs, clasp/, agente/, docs/) NO gastan build minutes:
  # Netlify corre este comando; si no hay diff en estos paths, marca el deploy como "Skipped" (gratis).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html retro-julio.html netlify.toml '*.png'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    X-XSS-Protection         = "1; mode=block"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[redirects]]
  from   = "/"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404
